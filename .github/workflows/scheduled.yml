name: Scheduled CI

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

jobs:
  scheduled-test:
    name: Scheduled Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Show scheduled run
        run: echo "Scheduled CI ran successfully."
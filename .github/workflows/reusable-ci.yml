name: Reusable CI

on:
  workflow_call:
  workflow_dispatch:

jobs:
  test:
    name: Reusable Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Confirm reusable workflow
        run: echo "Reusable CI completed successfully."
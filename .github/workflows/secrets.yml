name: GitHub Secrets

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  secrets-test:
    name: Test GitHub Secret
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check secret
        env:
          DEMO_SECRET: ${{ secrets.DEMO_SECRET }}
        run: |
          if [ -n "$DEMO_SECRET" ]; then
            echo "GitHub secret is configured successfully."
          else
            echo "GitHub secret is not configured."
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
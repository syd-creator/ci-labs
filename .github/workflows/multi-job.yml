name: Multi-Job CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check code style
        run: echo "Checking code style..."

      - name: Lint passed
        run: echo "Lint passed!"

  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run tests
        run: npm test

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Security scan
        run: echo "Scanning for vulnerabilities..."

      - name: Security scan passed
        run: echo "No vulnerabilities found!"

  build:
    name: Build Application
    runs-on: ubuntu-latest

    needs:
      - lint
      - test
      - security-scan

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build application
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-build
          path: dist/

  notify:
    name: Send Notification
    runs-on: ubuntu-latest

    needs:
      - build

    if: github.ref == 'refs/heads/main'

    steps:
      - name: Send notification
        run: echo "Build succeeded on main! Would send a Slack/email notification here."